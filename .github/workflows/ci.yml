name: Testes

on:
  push:
    branches: [main]
    # Uma tag de versão (v0.2.0) também gera o APK
    tags: ["v*"]
  pull_request:
  # O botão "Run workflow" no GitHub: testes e o APK
  workflow_dispatch:

# Um push novo cancela a rodada anterior do mesmo branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test test

  # O build leva minutos: só quando pedido (botão) ou numa tag de versão
  android:
    name: Android (APK)
    needs: flutter
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true
      # Só arm64 (os celulares atuais). Sem android/key.properties, o release
      # sai assinado com a chave de debug
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: vigil-android
          path: build/app/outputs/flutter-apk/app-release.apk
